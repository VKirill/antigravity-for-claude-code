# lefthook.yml
# Drop into project root.
# Install: npm i -D lefthook && npx lefthook install
# (or via brew/cargo/go/curl — lefthook is a single binary, no Node required to run)

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,jsx,ts,tsx,vue,astro}"
      run: npx eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{json,md,yml,yaml,css,scss}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner
        else
          echo "gitleaks not installed, skipping secret scan"
        fi

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    tests:
      run: npm test --silent
